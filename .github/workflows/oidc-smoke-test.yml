# ─── OIDC SMOKE TEST (TEMPORARY — DELETE AFTER OIDC IS CONFIRMED) ─────────────
#
# Validates the GitHub OIDC -> AWS assume-role path WITHOUT deploying or writing
# anything, before the first real merge to main. It only proves the identity:
# `aws sts get-caller-identity` succeeds ONLY if the OIDC token was minted and
# the github-actions-deploy role was assumed. That is the entire purpose of the
# smoke test.
#
# We deliberately do NOT test the s3:PutObject permission here: the role grants
# PutObject on the LIVE index.html object only, so any write test would clobber
# the production site. The actual deploy permissions are proven by the first real
# merge to main, which runs while the static-key secrets are still present as a
# fallback (do not remove them until that merge deploys green). See the runbook.
#
# Prerequisites (founder, one-time, then revert):
#   1. terraform apply -var="enable_oidc_smoke_test=true"  (adds the
#      oidc-smoke-test branch ref to the role's trusted subjects)
#   2. Set repo variable AWS_DEPLOY_ROLE_ARN.
#   3. Push this file on a branch literally named `oidc-smoke-test`, then run
#      this workflow from the Actions tab (workflow_dispatch) on that branch.
#
# After a green run:
#   - terraform apply -var="enable_oidc_smoke_test=false" (or drop the flag) to
#     remove the test subject, and
#   - delete this workflow file and the oidc-smoke-test branch.
#
# Note on the branch guard below: GitHub mints the OIDC token before job-level
# `if` is evaluated, so the IAM trust policy (sub = StringEquals exact ref) is
# the real gate, not this guard. The guard is defense-in-depth so the steps only
# run on the intended branch.

name: OIDC Smoke Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-oidc:
    name: Verify OIDC assume-role
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/oidc-smoke-test'
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify assumed identity (fails if OIDC assume-role did not work)
        run: |
          set -euo pipefail
          IDENTITY=$(aws sts get-caller-identity --output text --query Arn)
          echo "Assumed identity: $IDENTITY"
          case "$IDENTITY" in
            *:assumed-role/github-actions-deploy/*)
              echo "OIDC assume-role succeeded for github-actions-deploy." ;;
            *)
              echo "ERROR: unexpected identity — expected an assumed github-actions-deploy role." >&2
              exit 1 ;;
          esac