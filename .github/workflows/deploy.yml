name: Deploy Cloud Resume

on:
  push:
    branches:
      - main

# OIDC: the job mints a short-lived token (id-token: write) and exchanges it for
# temporary AWS credentials by assuming the github-actions-deploy role. No static
# AWS access keys are used or stored. contents: read is the least privilege the
# checkout needs.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy HTML to S3
        run: |
          aws s3 cp website/index.html s3://${{ secrets.S3_BUCKET }}/index.html

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/"

      - name: Confirm deployment
        run: echo "Deployed successfully to https://d19mfjmr0dtnqm.cloudfront.net"